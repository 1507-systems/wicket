name: Close Cortex Issues
on:
  push:
    branches: [main]
jobs:
  close:
    # coffer#40's shared workflow lists the merged PR, so the job needs
    # pull-requests: read as well as contents: read.
    permissions:
      contents: read
      pull-requests: read
    uses: 1507-systems/coffer/.github/workflows/cortex-close-shared.yml@d04c68bce22fe2e22e6da637fbad96f0907de3bc
    with:
      # Self-hosted when the repo sets RUNNER_LABEL (private repos);
      # GitHub-hosted otherwise (free for public repos).
      runs_on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
      cortex_api_base: ${{ vars.CORTEX_API_BASE || 'https://cortex.1507.cloud' }}
    secrets:
      CORTEX_WRITE_TOKEN: ${{ secrets.CORTEX_WRITE_TOKEN }}
